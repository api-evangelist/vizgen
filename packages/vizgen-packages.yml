description: >-
  First-party Vizgen open-source packages. Vizgen publishes no client SDK for a web
  API (it operates no public REST/GraphQL API); what it does publish is the Vizgen
  Post-processing Tool (VPT) — an Apache-2.0 Python CLI plus an importable core
  library and a family of segmentation plugins — used to reprocess MERSCOPE
  single-cell outputs. Every package below was confirmed live on PyPI at fetch time
  (HTTP 200) with `Author: Vizgen` and a Vizgen GitHub repository URL, which is what
  `official: true` is asserting. No npm, Maven Central, NuGet, RubyGems, Packagist,
  crates.io, or pkg.go.dev package was found for this provider.
docs: https://vizgen.github.io/vizgen-postprocessing/
