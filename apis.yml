aid: vizgen
name: Vizgen
description: 'Vizgen is a spatial biology company building integrated spatial multiomics
  platforms for single-cell research. Its MERSCOPE and MERSCOPE Ultra instruments use
  MERFISH imaging-based spatial transcriptomics to map up to 1,000 RNA targets in intact
  tissue at subcellular resolution, complemented by InSituPlex multiplex protein
  immunofluorescence assays (OmniVUE and custom U-VUE panels) and the STARVUE analysis
  software. Vizgen publishes no public REST, GraphQL, or event API; its developer surface
  is open-source data tooling — the Apache-2.0 Vizgen Post-processing Tool (VPT), a Python
  CLI and library distributed on PyPI and Docker Hub with a plugin architecture for
  segmentation algorithms, published from the Vizgen GitHub organization alongside
  documented MERSCOPE output data formats.'
