description: >-
  Vizgen's published example payloads for the one machine-readable contract it does define:
  the VPT segmentation algorithm specification JSON, the document `vpt run-segmentation
  --segmentation-algorithm` consumes. These are the provider's own example files, saved
  verbatim from the vizgen-postprocessing repository — nothing here is authored or modified
  by API Evangelist. There is no OpenAPI to attach request/response examples to; this is the
  equivalent example surface for a CLI-shaped developer contract.
docs: https://vizgen.github.io/vizgen-postprocessing/segmentation_options/json_file_format.html
format:
  name: VPT segmentation algorithm specification
  media_type: application/json
  top_level_keys:
    - {key: experiment_properties, description: Experiment-level properties such as z-plane spacing.}
    - {key: segmentation_tasks, description: One or more segmentation task definitions — family, entity type, stain-to-channel mapping, and algorithm parameters.}
    - {key: segmentation_task_fusion, description: How the outputs of multiple segmentation tasks are fused into final entity boundaries.}
    - {key: output_files, description: The output artifacts the run should produce.}
  reference:
    task_definition: https://vizgen.github.io/vizgen-postprocessing/segmentation_options/segmentation_task_definition.html
    task_fusion: https://vizgen.github.io/vizgen-postprocessing/segmentation_options/task_fusion_definition.html
